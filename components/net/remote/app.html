<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Buddy">
<link id="manifest" rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/icon.png">
<link rel="icon" href="/app/icon.png">
<title>Arixware buddy</title>
<style>
  :root { --text:#FFF4DF; --soft:#FFD49B; --amber:#FF9347; --dim:#8a6a47; --panel:#16100a; --line:#33200f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#000; }
  body { margin:0; color:var(--text); font:16px/1.4 "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
         padding:max(14px, env(safe-area-inset-top)) 14px max(40px, env(safe-area-inset-bottom));
         max-width:560px; margin-inline:auto;
         background:radial-gradient(120% 60% at 50% 0%, #2a1707 0%, #000 62%) no-repeat; min-height:100vh; }
  [hidden] { display:none !important; }

  .hero { position:relative; border-radius:28px; padding:18px 12px 14px; margin-bottom:14px; overflow:hidden;
          background:#000; border:1px solid var(--line); box-shadow:0 10px 40px #ff93471a; }
  .eyes { display:block; width:78%; max-width:330px; height:auto; margin:0 auto 4px; }
  .hero h1 { margin:0; text-align:center; font-size:20px; font-weight:600; color:var(--soft); letter-spacing:.02em; }
  .chip { display:flex; width:max-content; margin:6px auto 0; gap:8px; align-items:center; padding:4px 12px; font-size:13px;
          border-radius:999px; background:#0008; border:1px solid var(--line); color:var(--soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:#5a4a38; }
  .dot.on { background:#7CFFB0; box-shadow:0 0 8px #7CFFB0; }
  .dot.sleep { background:var(--amber); box-shadow:0 0 8px var(--amber); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:16px; margin:12px 0; }
  h2 { display:flex; align-items:center; gap:8px; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
       color:var(--amber); margin:0 0 12px; font-weight:600; }
  button { font:inherit; color:var(--text); background:#241608; border:2px solid #6b3c14; border-radius:16px; padding:10px 14px;
           transition:background .15s, border-color .15s, color .15s, transform .1s; }
  button:active { transform:scale(.97); }
  button.on, button.primary { background:var(--amber); border-color:var(--amber); color:#1c1208; font-weight:600; }
  input { font:inherit; color:var(--text); background:#0a0603; border:2px solid var(--line); border-radius:14px; padding:9px 12px; width:100%; }
  input[type=range] { padding:0; height:34px; accent-color:var(--amber); background:none; border:0; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 0; min-width:0; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .grid button { padding:9px 2px; font-size:13px; line-height:1.15; border-radius:14px; display:flex; flex-direction:column;
                 align-items:center; gap:2px; }
  .grid .emoji { font-size:22px; }
  .slider-label { display:flex; justify-content:space-between; color:var(--soft); font-size:14px; margin-top:4px; }
  .note { color:var(--dim); font-size:13px; margin:8px 0 0; }
  #login input { text-align:center; font-size:30px; letter-spacing:.35em; }
  #toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translate(-50%, 20px);
           background:var(--amber); color:#1c1208; padding:10px 18px; border-radius:999px; font-weight:600; opacity:0;
           transition:opacity .25s, transform .25s; pointer-events:none; z-index:5; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  details summary { cursor:pointer; color:var(--soft); }
</style>
</head>
<body>

<div class="hero">
  <img class="eyes" src="/app/eyes.png" alt="Arixware buddy" width="420" height="198">
  <h1>Arixware buddy</h1>
  <div class="chip"><span id="dot" class="dot"></span><span id="status">Connecting...</span></div>
</div>

<section id="login" hidden>
  <h2>Remote code</h2>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="off">
  <div class="row"><button id="login-go" class="primary">Connect</button></div>
  <p class="note">Easier: on the arix open Settings, then Portal, and scan the QR code. Or type the 6-digit code from Settings, About.</p>
  <p id="login-error" class="note"></p>
</section>

<main id="main" hidden>
  <section>
    <h2>Eye mood</h2>
    <div class="grid" id="moods"></div>
  </section>

  <section>
    <h2>Display and sound</h2>
    <div class="slider-label"><span>Brightness</span><span id="bright-v"></span></div>
    <input id="bright" type="range" min="5" max="100">
    <div class="slider-label"><span>Volume</span><span id="volume-v"></span></div>
    <input id="volume" type="range" min="0" max="100">
    <div class="row"><button id="dnd">Do not disturb</button><button id="sleep">Sleep</button></div>
  </section>

  <section>
    <h2>Alarm</h2>
    <div class="row"><input id="alarm-time" type="time" value="07:00"><button id="alarm-toggle">Alarm off</button></div>
  </section>

  <section>
    <h2>Timer</h2>
    <div class="row"><input id="timer-min" type="number" min="1" max="99" value="5" aria-label="Minutes"><button id="timer-go" class="primary">Start</button></div>
    <p id="timer-note" class="note"></p>
  </section>

  <section>
    <h2>Firmware</h2>
    <div class="row"><span id="fw-version" class="note"></span><button id="fw-update">Check for update</button></div>
    <div class="row"><button id="fw-auto">Auto update</button></div>
    <p id="fw-note" class="note"></p>
  </section>

  <section id="install-box">
    <h2>Home screen</h2>
    <button id="install" class="primary" style="width:100%">Add to home screen</button>
    <p id="install-help" class="note" hidden></p>
  </section>

  <section>
    <button id="logout" style="width:100%">Forget this phone</button>
  </section>
</main>
<div id="toast"></div>

<script>
const MOODS = [
  ['Default', '😐'], ['Happy', '🙂'], ['Excited', '🤩'], ['Pleased', '😌'], ['Smile', '😊'], ['Big smile', '😄'],
  ['Content', '☺️'], ['Relaxed', '😌'], ['Blink', '😑'], ['Wink left', '😉'], ['Wink right', '😉'], ['Curious', '🧐'],
  ['Surprised', '😮'], ['Amazed', '🤯'], ['Love', '😍'], ['Blushing', '😳'], ['Shy', '🙈'], ['Nervous', '😬'],
  ['Angry', '😠'], ['Determined', '😤'], ['Suspicious', '🤨'], ['Sad', '😢'], ['Worried', '😟'], ['Confused', '😕'],
  ['Sleeping', '😴'], ['Sleeping zzz', '💤'], ['Dreamy', '🥱'], ['Hypnotized', '😵‍💫'], ['Focused', '🎯'], ['Laugh', '😂'],
];
const TIMER_STATES = ['Ready', 'Running', 'Paused', 'Time is up'];
const $ = id => document.getElementById(id);

let code = '';
let state = null;
let shownMood = 0;
let pollTimer = 0;
let busyUntil = 0; // while a slider is being dragged, polls must not move it back

/* The mood buttons show which expression the arix is wearing. */
function showMood(m) {
  if (m < 0 || m >= MOODS.length) return;
  shownMood = m;
  document.querySelectorAll('#moods button').forEach((b, i) => b.classList.toggle('on', i === m));
}

/* ---------------------------------------------------------------- talking to the arix */
function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

function showLogin(message) {
  $('main').hidden = true;
  $('login').hidden = false;
  $('login-error').textContent = message || '';
  setChip(false, message || 'Enter the remote code');
  clearInterval(pollTimer);
}

function setChip(ok, label, asleep) {
  $('status').textContent = label;
  $('dot').className = 'dot' + (ok ? (asleep ? ' sleep' : ' on') : '');
}

async function call(body) {
  const res = await fetch('/api/remote', {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Code': code, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showLogin('Wrong code'); throw new Error('code'); }
  if (res.status === 429) { showLogin('Too many tries. Wait a minute.'); throw new Error('locked'); }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const fatal = e => e.message === 'code' || e.message === 'locked';

function render(s) {
  state = s;
  setChip(true, s.asleep ? 'Asleep' : 'Connected', s.asleep);
  if (Date.now() > busyUntil) {
    $('bright').value = s.brightness; $('bright-v').textContent = s.brightness + '%';
    $('volume').value = s.volume; $('volume-v').textContent = s.volume + '%';
  }
  $('dnd').classList.toggle('on', s.dnd);
  $('sleep').textContent = s.asleep ? 'Wake up' : 'Sleep';
  $('sleep').classList.toggle('on', s.asleep);
  const hh = String(s.alarm.hour).padStart(2, '0'), mm = String(s.alarm.minute).padStart(2, '0');
  if (document.activeElement !== $('alarm-time')) $('alarm-time').value = `${hh}:${mm}`;
  $('alarm-toggle').textContent = s.alarm.ringing ? 'Ringing!' : s.alarm.enabled ? 'Alarm on' : 'Alarm off';
  $('alarm-toggle').classList.toggle('on', s.alarm.enabled);
  const t = s.timer;
  $('timer-note').textContent = t.state === 0 ? '' : TIMER_STATES[t.state] +
    (t.state < 3 ? ` - ${Math.floor(t.remaining / 60)}:${String(t.remaining % 60).padStart(2, '0')} left` : '');
  if (s.mood >= 0) showMood(s.mood);
  const u = s.update, busy = u.state === 'checking' || u.state === 'installing' || u.state === 'done';
  $('fw-version').textContent = 'Version ' + u.version;
  $('fw-update').disabled = busy;
  $('fw-auto').classList.toggle('on', u.auto);
  $('fw-auto').textContent = u.auto ? 'Auto update on' : 'Auto update off';
  $('fw-note').textContent = {
    checking: 'Checking for an update...',
    installing: `Installing ${u.latest}: ${u.progress}%. Do not unplug the arix.`,
    done: `Installed ${u.latest}. The arix is restarting.`,
    current: 'You have the newest firmware.',
    failed: 'Update failed: ' + u.error,
  }[u.state] || '';
}

async function refresh() {
  try { render(await call()); }
  catch (e) { if (!fatal(e)) setChip(false, 'Arix not reachable'); }
}

async function send(body, okText) {
  try { render(await call(body)); if (okText) toast(okText); }
  catch (e) { if (!fatal(e)) toast('Arix not reachable'); }
}

function start() {
  localStorage.setItem('buddyCode', code);
  /* The manifest carries the code so an app added to the home screen opens already paired. */
  $('manifest').href = '/app/manifest.json?pair=' + encodeURIComponent(code);
  $('login').hidden = true;
  $('main').hidden = false;
  refresh();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden) refresh(); }, 3000);
}

/* ---------------------------------------------------------------- controls */
MOODS.forEach(([name, emoji], i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="emoji">${emoji}</span><span>${name}</span>`;
  b.onclick = () => { showMood(i); send({ mood: i }); };
  $('moods').appendChild(b);
});

$('login-go').onclick = async () => {
  code = $('code').value.trim();
  try { await call(); start(); }
  catch (e) { if (!fatal(e)) $('login-error').textContent = 'Arix not reachable'; }
};
$('logout').onclick = () => { localStorage.removeItem('buddyCode'); code = ''; history.replaceState(null, '', '/app'); showLogin(''); };

function slider(id, key) {
  let timer = 0;
  $(id).addEventListener('input', e => {
    busyUntil = Date.now() + 2500;
    $(id + '-v').textContent = e.target.value + '%';
    clearTimeout(timer);
    timer = setTimeout(() => send({ [key]: Number(e.target.value) }), 120);
  });
}
slider('bright', 'brightness');
slider('volume', 'volume');
$('dnd').onclick = () => send({ dnd: !(state && state.dnd) });
$('sleep').onclick = () => send({ sleep: !(state && state.asleep) }, state && state.asleep ? 'Waking up' : 'Going to sleep');
const alarmTime = () => $('alarm-time').value.split(':').map(Number);
$('alarm-toggle').onclick = () => { const [h, m] = alarmTime(); send({ alarm: { hour: h, minute: m, enabled: !(state && state.alarm.enabled) } }); };
$('alarm-time').onchange = () => { const [h, m] = alarmTime(); send({ alarm: { hour: h, minute: m, enabled: !!(state && state.alarm.enabled) } }, 'Alarm time saved'); };
$('timer-go').onclick = () => {
  const minutes = Math.min(99, Math.max(1, Number($('timer-min').value) || 5));
  send({ timer: { minutes, start: true } }, 'Timer started');
};

/* ---------------------------------------------------------------- install */
let installPrompt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (standalone) $('install-box').hidden = true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { $('install-box').hidden = true; toast('Installed'); });
$('fw-update').onclick = () => send({ update: true });
$('fw-auto').onclick = () => send({ autoUpdate: !(state && state.update.auto) });
$('install').onclick = async () => {
  if (installPrompt) {
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    return;
  }
  /* Browsers only offer a real install on https pages with a service worker; the arix speaks plain
   * http on your Wi-Fi, so the home-screen shortcut is the best a phone allows. */
  const help = $('install-help');
  help.hidden = false;
  help.textContent = ios
    ? 'Tap the Share button in Safari, then Add to Home Screen. It opens full screen like an app.'
    : 'Open the browser menu (three dots), then Add to Home screen. Android only offers a full install for https sites, so this adds a shortcut.';
};

/* ---------------------------------------------------------------- start */
const params = new URLSearchParams(location.search);
code = params.get('pair') || localStorage.getItem('buddyCode') || '';
if (code) {
  call().then(start).catch(e => { if (!fatal(e)) setChip(false, 'Arix not reachable'); });
} else {
  showLogin('');
}
</script>
</body>
</html>
